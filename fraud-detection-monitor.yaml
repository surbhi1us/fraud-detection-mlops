
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fraud-detection-monitor
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: fraud-detection-api
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s
